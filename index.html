<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sää</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="card">
  <section class="info-section">
    <div class="background-design">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <div class="left-side">
      <div class="weather">
        <div class="icon-current"></div>
        <div class="weather-label">Ladataan…</div>
      </div>
      <div class="temperature">--°</div>
      <div class="range">--°/--°</div>
    </div>
    <div class="right-side">
      <div>
        <div class="hour">--:--</div>
        <div class="date">---</div>
      </div>
      <div class="city">--</div>
    </div>
  </section>
  <section class="days-section">
    <button><span class="day">--</span><span class="icon-weather-day"></span></button>
    <button><span class="day">--</span><span class="icon-weather-day"></span></button>
    <button><span class="day">--</span><span class="icon-weather-day"></span></button>
    <button><span class="day">--</span><span class="icon-weather-day"></span></button>
  </section>
  

  <div class="extra-info">
  <div class="info-row">
    <span class="info-title">Seuraava sade:</span>
    <span class="next-rain">Lasketaan...</span>
  </div>
  <div class="info-row">
    <span class="info-title">Päivänvalo:</span>
    <span class="daylight-info">Lasketaan...</span>
  </div>

    <div class="info-row">
    <span class="info-title">Auringonnousu:</span>
    <span class="sunrise-info">Lasketaan...</span>
  </div>
  <div class="info-row">
    <span class="info-title">Kuu:</span>
    <span class="moon-info">Lasketaan...</span>
  </div>
  <div class="info-row">
    <span class="info-title">Tähtitaivas (yö):</span>
    <span class="stargazing-info">Lasketaan...</span>
  </div>

</div>



</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script src="script.js"></script>

</body>
</html>
